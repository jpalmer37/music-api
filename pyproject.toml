[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music-api"
version = "0.2.0"
description = "Personal toolkit for browsing and managing Spotify and YouTube Music libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "spotipy==2.26.0",
    "ytmusicapi==1.12.3",
    "python-dotenv>=1.0.0",
]

[project.scripts]
music-api = "music_api.cli:main"

[tool.setuptools]
packages = ["music_api"]
