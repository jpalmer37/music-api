[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music-api"
version = "0.1.0"
description = "Personal toolkit for browsing and managing Spotify and YouTube Music libraries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "spotipy>=2.23.0",
    "ytmusicapi>=1.3.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["music_api"]
